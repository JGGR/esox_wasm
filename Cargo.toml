[package]
name = "esox_wasm"
version = "0.2.0"
edition = "2021"
description = "WASM glue library for NISECI and HFBI calc"
license = "GPL-3.0-only"
repository = "https://github.com/JGGR/esox_wasm"
include = [
    "src/*",
    "LICENSE",
]

[features]
experimental = [ "esox/experimental" ]
json = [ "esox/json" ]

[lib]
crate-type = ["cdylib"]

[dependencies]
esox = "0.2.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"
